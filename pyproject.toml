[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom"
version = "0.1.0"
description = "AXIOM — proprietary AI hedge fund platform: ICT alpha engine, research terminal, and paper-first execution."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Free / low-cost market data adapters.
yfinance = ["yfinance>=0.2.40"]
# The Alpaca adapter speaks REST directly and needs no SDK; this extra
# is only for users who want alpaca-py for other purposes.
alpaca = ["alpaca-py>=0.21"]
crypto = ["ccxt>=4.3"]
# Futures data. Unlike the other adapters this one uses the vendor SDK rather
# than raw REST: Databento's wire format is DBN, whose prices are fixed-point
# int64 scaled by 1e-9, and decoding that correctly is the vendor's job.
databento = ["databento>=0.34"]
# Load your own training data from the Hugging Face Hub.
huggingface = ["datasets>=2.20"]
# AI agent layer (Research / Debate / Backtest / Risk / Review).
agents = ["anthropic>=0.34"]
# Browser console: HTTP API plus the single-page operator UI. The frontend is
# plain HTML/CSS/JS served as package data, so there is no Node toolchain here.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# NOTE: OpenBB is AGPL-3.0. It is deliberately NOT a core dependency and is
# isolated behind axiom.data.providers.openbb_provider. See docs/LICENSING.md
# before enabling this extra in anything you intend to distribute.
openbb = ["openbb>=4.3"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # The web tests drive the API through Starlette's TestClient, which needs
    # httpx. Kept in `dev` so `pip install -e '.[dev]'` runs the whole suite.
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
axiom = "axiom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]
# The console's HTML/CSS/JS are package data, not source. Without this the
# wheel installs an API that serves a 404 at "/".
artifacts = ["src/axiom/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires outbound network access",
    "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    # `str, Enum` rather than `StrEnum`: these values are serialised into
    # config, reports, and JSON, and the mixin's behaviour there is what we
    # want. Deliberate, not legacy.
    "UP042",
    # Typographic characters (×, –, ⚠) appear in operator-facing strings on
    # purpose; the terminal and reports are meant to be read by humans.
    "RUF001", "RUF002", "RUF003",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/axiom"]
